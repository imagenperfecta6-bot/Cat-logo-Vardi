<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="sh"><stop offset="0" stop-color="#000" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="bag" x1="0" x2="1"><stop offset="0" stop-color="#0a2f7a"/><stop offset=".5" stop-color="#1a4bb0"/><stop offset="1" stop-color="#00205b"/></linearGradient>
    <g id="bear">
      <circle cx="0" cy="-42" r="26" style="fill:var(--c)"/><circle cx="-20" cy="-64" r="10" style="fill:var(--c)"/><circle cx="20" cy="-64" r="10" style="fill:var(--c)"/>
      <ellipse cx="0" cy="8" rx="32" ry="40" style="fill:var(--c)"/>
      <circle cx="-30" cy="-6" r="11" style="fill:var(--c)"/><circle cx="30" cy="-6" r="11" style="fill:var(--c)"/>
      <circle cx="-20" cy="44" r="13" style="fill:var(--c)"/><circle cx="20" cy="44" r="13" style="fill:var(--c)"/>
      <ellipse cx="-8" cy="-50" rx="8" ry="5" fill="#fff" opacity=".55"/><ellipse cx="-10" cy="-4" rx="9" ry="14" fill="#fff" opacity=".35"/>
    </g>
  </defs>
  <rect width="800" height="800" fill="#ffffff"/>
  <ellipse cx="400" cy="660" rx="310" ry="38" fill="url(#sh)"/>
  <!-- bolsa doypack -->
  <path d="M250 150 h300 l14 470 c0 18 -14 30 -32 30 h-264 c-18 0 -32 -12 -32 -30 z" fill="url(#bag)"/>
  <rect x="250" y="150" width="300" height="40" fill="#fce300"/>
  <path d="M262 175 h276" stroke="#00205b" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="400" y="262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="50" fill="#ffffff">TU LOGO</text>
  <text x="400" y="298" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" fill="#fce300" letter-spacing="4">GOMITAS</text>
  <!-- ventana -->
  <rect x="300" y="330" width="200" height="230" rx="100" fill="#e8f2ff" opacity=".95"/>
  <use href="#bear" transform="translate(360 430) scale(.8) rotate(-12)" style="--c:#ff5a5a"/>
  <use href="#bear" transform="translate(440 455) scale(.8) rotate(10)" style="--c:#2fb36f"/>
  <use href="#bear" transform="translate(395 515) scale(.75)" style="--c:#f5a400"/>
  <!-- gomitas sueltas -->
  <use href="#bear" transform="translate(190 590) rotate(-18)" style="--c:#e23b5a"/>
  <use href="#bear" transform="translate(620 600) rotate(14)" style="--c:#5ec8ff"/>
  <use href="#bear" transform="translate(675 520) rotate(30) scale(.85)" style="--c:#fcb900"/>
</svg>
