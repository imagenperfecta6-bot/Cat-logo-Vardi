<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="wr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a4bb0"/><stop offset="1" stop-color="#00205b"/></linearGradient>
    <linearGradient id="foil" x1="0" x2="1"><stop offset="0" stop-color="#cfd6e2"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#aab4c4"/></linearGradient>
    <linearGradient id="choc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a4a2c"/><stop offset="1" stop-color="#4a2814"/></linearGradient>
    <radialGradient id="sh"><stop offset="0" stop-color="#000" stop-opacity=".2"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="800" fill="#ffffff"/>
  <ellipse cx="400" cy="600" rx="320" ry="40" fill="url(#sh)"/>
  <g transform="rotate(-8 400 400)">
    <!-- chocolate expuesto -->
    <rect x="150" y="300" width="170" height="230" rx="10" fill="url(#choc)"/>
    <g fill="#8a5735" stroke="#3d200f" stroke-width="3">
      <rect x="162" y="312" width="68" height="64" rx="8"/><rect x="240" y="312" width="68" height="64" rx="8"/>
      <rect x="162" y="386" width="68" height="64" rx="8"/><rect x="240" y="386" width="68" height="64" rx="8"/>
      <rect x="162" y="460" width="68" height="60" rx="8"/><rect x="240" y="460" width="68" height="60" rx="8"/>
    </g>
    <!-- papel aluminio -->
    <path d="M300 296 l40 -10 l-6 30 l10 30 l-8 40 l12 34 l-10 44 l8 40 l-12 38 l-34 4 z" fill="url(#foil)"/>
    <!-- envoltura -->
    <rect x="320" y="290" width="340" height="250" rx="12" fill="url(#wr)"/>
    <rect x="320" y="290" width="340" height="22" rx="10" fill="#fce300"/>
    <rect x="320" y="518" width="340" height="22" rx="10" fill="#fce300"/>
    <text x="490" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="52" fill="#ffffff">TU LOGO</text>
    <text x="490" y="475" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" fill="#fce300" letter-spacing="4">CHOCOLATE</text>
    <rect x="330" y="300" width="320" height="8" rx="4" fill="#ffffff" opacity=".25"/>
  </g>
  <!-- bombones envueltos -->
  <g transform="translate(560 610)"><rect x="-46" y="-34" width="92" height="68" rx="12" fill="url(#wr)"/><rect x="-46" y="-34" width="92" height="12" rx="6" fill="#fce300"/><text x="0" y="12" text-anchor="middle" font-family="Arial" font-weight="800" font-size="20" fill="#fff">LOGO</text></g>
  <g transform="translate(250 625) rotate(10)"><rect x="-46" y="-34" width="92" height="68" rx="12" fill="url(#wr)"/><rect x="-46" y="-34" width="92" height="12" rx="6" fill="#fce300"/><text x="0" y="12" text-anchor="middle" font-family="Arial" font-weight="800" font-size="20" fill="#fff">LOGO</text></g>
</svg>
